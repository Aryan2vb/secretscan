[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscan"
version = "0.1.0"
description = "Find leaked secrets in files and git history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
secretscan = "secretscan.cli:main"

[tool.setuptools]
packages = ["secretscan"]
